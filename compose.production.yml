services:
  wb2api:
    image: ${WB2API_IMAGE:?Set WB2API_IMAGE to a published image digest or sha tag}
    container_name: workbuddy2api
    restart: unless-stopped
    user: "10001:10001"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json
    networks:
      flowai:
        aliases:
          - workbuddy2api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  flowai:
    external: true
    name: flowai-network
